<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>paddleMe</title>
  <style>
    /* ------------------------------------------------------------------ */
    /* Reset / base                                                        */
    /* ------------------------------------------------------------------ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #111;
      --surface:   #1e1e1e;
      --border:    #333;

      --green:     #22c55e;
      --yellow:    #facc15;
      --red:       #ef4444;
      --blue:      #3b82f6;
      --muted:     #6b7280;

      --text:      #f4f4f5;
      --text-dim:  #a1a1aa;

      --btn-h:     72px;   /* touch-friendly button height */
      --radius:    12px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 18px;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ------------------------------------------------------------------ */
    /* Connection badge                                                    */
    /* ------------------------------------------------------------------ */
    #conn-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-dim);
    }

    #conn-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }

    #conn-dot.connected    { background: var(--green); }
    #conn-dot.disconnected { background: var(--red);   }

    /* ------------------------------------------------------------------ */
    /* Status card                                                         */
    /* ------------------------------------------------------------------ */
    #status-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 20px;
    }

    .stat-row { display: flex; flex-direction: column; gap: 2px; }
    .stat-label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); }
    .stat-value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }

    #machine-state { grid-column: 1 / -1; }

    .state-ESTOP       { color: var(--red);    }
    .state-ESTOP_RESET { color: var(--yellow); }
    .state-OFF         { color: var(--muted);  }
    .state-ON          { color: var(--green);  }
    .state-RUNNING     { color: var(--green);  }
    .state-PAUSED      { color: var(--yellow); }
    .state-IDLE        { color: var(--blue);   }

    /* ------------------------------------------------------------------ */
    /* Buttons                                                             */
    /* ------------------------------------------------------------------ */
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-row.single { grid-template-columns: 1fr; }

    button {
      height: var(--btn-h);
      border: none;
      border-radius: var(--radius);
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      transition: filter .1s, transform .08s;
      letter-spacing: .02em;
    }

    button:active  { filter: brightness(.85); transform: scale(.97); }
    button:disabled { opacity: .35; cursor: not-allowed; transform: none; filter: none; }

    #btn-start  { background: var(--green);  color: #000; }
    #btn-hold   { background: var(--yellow); color: #000; }
    #btn-resume { background: var(--blue);   color: #fff; }
    #btn-stop   { background: var(--muted);  color: #fff; }

    /* ------------------------------------------------------------------ */
    /* Sliders                                                             */
    /* ------------------------------------------------------------------ */
    .slider-group {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .slider-label { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); }
    .slider-readout { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 44px;          /* fat track = gloveable */
      background: transparent;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-runnable-track {
      height: 14px;
      border-radius: 7px;
      background: var(--border);
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--blue);
      margin-top: -15px;
      border: 3px solid #fff;
    }

    input[type=range]::-moz-range-track {
      height: 14px;
      border-radius: 7px;
      background: var(--border);
    }

    input[type=range]::-moz-range-thumb {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--blue);
      border: 3px solid #fff;
    }

    /* ------------------------------------------------------------------ */
    /* Subroutine section                                                  */
    /* ------------------------------------------------------------------ */
    .section-header {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .btn-sub {
      flex: 1 1 calc(50% - 6px);
      height: var(--btn-h);
      border: none;
      border-radius: var(--radius);
      font-size: 18px;
      font-weight: 700;
      background: #2d3748;
      color: var(--text);
      cursor: pointer;
      user-select: none;
      transition: filter .1s, transform .08s;
    }

    .btn-sub:active  { filter: brightness(.85); transform: scale(.97); }
    .btn-sub:disabled { opacity: .35; cursor: not-allowed; transform: none; filter: none; }

    /* ------------------------------------------------------------------ */
    /* Error toast                                                         */
    /* ------------------------------------------------------------------ */
    #toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--red);
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      transition: transform .25s;
      pointer-events: none;
      white-space: nowrap;
    }

    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- Connection indicator -->
  <div id="conn-badge">
    <div id="conn-dot"></div>
    <span id="conn-label">Connecting…</span>
  </div>

  <!-- Status card -->
  <div id="status-card">
    <div class="stat-row" id="machine-state">
      <span class="stat-label">Machine state</span>
      <span class="stat-value" id="val-task-state">—</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Program</span>
      <span class="stat-value" id="val-interp-state">—</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Feed override</span>
      <span class="stat-value" id="val-feedrate">—</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Spindle override</span>
      <span class="stat-value" id="val-spindlerate">—</span>
    </div>
  </div>

  <!-- Run / Pause -->
  <div class="btn-row">
    <button id="btn-start"  disabled>▶ Run</button>
    <button id="btn-hold"   disabled>⏸ Pause</button>
  </div>
  <!-- Resume / Stop -->
  <div class="btn-row">
    <button id="btn-resume" disabled>↺ Resume</button>
    <button id="btn-stop"   disabled>■ Stop</button>
  </div>


  <!-- Feed rate override -->
  <div class="slider-group">
    <div class="slider-header">
      <span class="slider-label">Feed override</span>
      <span class="slider-readout" id="feed-readout">100%</span>
    </div>
    <input type="range" id="slider-feed" min="0" max="100" value="100" step="1" disabled />
  </div>

  <!-- Spindle override -->
  <div class="slider-group">
    <div class="slider-header">
      <span class="slider-label">Spindle override</span>
      <span class="slider-readout" id="spindle-readout">100%</span>
    </div>
    <input type="range" id="slider-spindle" min="0" max="100" value="100" step="1" disabled />
  </div>

  <!-- Subroutine buttons (rendered dynamically from server config) -->
  <div id="sub-section" style="display:none">
    <div class="section-header">Subroutines</div>
    <div class="btn-row" id="sub-btns" style="flex-wrap:wrap; gap:12px"></div>
  </div>

  <!-- Error toast -->
  <div id="toast"></div>

<script>
  'use strict';

  // -------------------------------------------------------------------------
  // Element references
  // -------------------------------------------------------------------------
  const connDot       = document.getElementById('conn-dot');
  const connLabel     = document.getElementById('conn-label');

  const valTaskState  = document.getElementById('val-task-state');
  const valInterpState= document.getElementById('val-interp-state');
  const valFeedrate   = document.getElementById('val-feedrate');
  const valSpindlerate= document.getElementById('val-spindlerate');

  const btnStart      = document.getElementById('btn-start');
  const btnHold       = document.getElementById('btn-hold');
  const btnResume     = document.getElementById('btn-resume');
  const btnStop       = document.getElementById('btn-stop');

  const subSection    = document.getElementById('sub-section');
  const subBtnsEl     = document.getElementById('sub-btns');
  let   subBtns       = [];

  const sliderFeed    = document.getElementById('slider-feed');
  const feedReadout   = document.getElementById('feed-readout');
  const sliderSpindle = document.getElementById('slider-spindle');
  const spindleReadout= document.getElementById('spindle-readout');

  const toast         = document.getElementById('toast');

  // -------------------------------------------------------------------------
  // Toast
  // -------------------------------------------------------------------------
  let toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
  }

  // -------------------------------------------------------------------------
  // WebSocket
  // -------------------------------------------------------------------------
  let ws = null;
  let reconnectDelay = 1000;

  function send(payload) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(payload));
    }
  }

  function connect() {
    const url = `ws://${location.host}/ws`;
    ws = new WebSocket(url);

    ws.onopen = () => {
      connDot.className = 'connected';
      connLabel.textContent = 'Connected';
      reconnectDelay = 1000;
      setControlsEnabled(true);
    };

    ws.onclose = () => {
      connDot.className = 'disconnected';
      connLabel.textContent = 'Disconnected — reconnecting…';
      setControlsEnabled(false);
      setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, 10000);
    };

    ws.onerror = () => {
      ws.close();
    };

    ws.onmessage = (evt) => {
      let msg;
      try { msg = JSON.parse(evt.data); } catch { return; }

      if (msg.type === 'config') handleConfig(msg);
      if (msg.type === 'status') handleStatus(msg);
      if (msg.type === 'error')  showToast(msg.message);
    };
  }

  // -------------------------------------------------------------------------
  // Status rendering
  // -------------------------------------------------------------------------
  // -------------------------------------------------------------------------
  // Config handler — renders subroutine buttons from server list
  // -------------------------------------------------------------------------
  function handleConfig(cfg) {
    subBtnsEl.innerHTML = '';
    subBtns = [];
    if (!cfg.subroutines || cfg.subroutines.length === 0) return;
    for (const sub of cfg.subroutines) {
      const btn = document.createElement('button');
      btn.className = 'btn-sub';
      btn.textContent = sub.label;
      btn.disabled = true;
      btn.addEventListener('click', () => send({ cmd: 'mdi', mdi: sub.mdi }));
      subBtnsEl.appendChild(btn);
      subBtns.push(btn);
    }
    subSection.style.display = 'block';
  }

  // LinuxCNC numeric constants mirrored from the server
  const INTERP_IDLE    = 1;
  const INTERP_RUNNING = 2;  // INTERP_READING in LinuxCNC
  const INTERP_PAUSED  = 3;
  const INTERP_WAITING = 4;

  // task_state values: 1=ESTOP 2=ESTOP_RESET 3=OFF 4=ON
  const TASK_ON = 4;

  function handleStatus(s) {
    // Task state
    valTaskState.textContent = s.task_state_label;
    valTaskState.className = `stat-value state-${s.task_state_label}`;

    // Interp state
    valInterpState.textContent = s.interp_state_label;
    valInterpState.className = `stat-value state-${s.interp_state_label}`;

    // Overrides (server sends 0.0–1.5)
    valFeedrate.textContent   = pct(s.feedrate);
    valSpindlerate.textContent= pct(s.spindlerate);

    // Keep sliders in sync with machine state while not dragging
    if (!draggingFeed) {
      sliderFeed.value = Math.round(s.feedrate * 100);
      feedReadout.textContent = pct(s.feedrate);
    }
    if (!draggingSpindle) {
      sliderSpindle.value = Math.round(s.spindlerate * 100);
      spindleReadout.textContent = pct(s.spindlerate);
    }

    // Button enable logic — mirroring AXIS keyboard shortcut conditions
    const machineOn = s.task_state === TASK_ON;
    const idle      = s.interp_state === INTERP_IDLE;
    const paused    = s.interp_state === INTERP_PAUSED;
    // Interp cycles between READING and WAITING while a program runs
    const active    = s.interp_state === INTERP_RUNNING || s.interp_state === INTERP_WAITING;

    btnStart.disabled  = !(machineOn && idle);         // R
    btnHold.disabled   = !(machineOn && active);        // P
    btnResume.disabled = !(machineOn && paused);        // S
    btnStop.disabled   = !(machineOn && (active || paused)); // ESC

    sliderFeed.disabled   = !machineOn;
    sliderSpindle.disabled= !machineOn;

    // Subroutines only available when machine is on and idle
    subBtns.forEach(b => b.disabled = !(machineOn && idle));
  }

  function pct(v) { return `${Math.round(v * 100)}%`; }

  // -------------------------------------------------------------------------
  // Controls enable / disable (used during disconnection)
  // -------------------------------------------------------------------------
  function setControlsEnabled(on) {
    if (!on) {
      [btnStart, btnHold, btnResume, btnStop,
       sliderFeed, sliderSpindle, ...subBtns].forEach(el => el.disabled = true);
    }
    // On reconnect the next status message re-enables appropriately.
  }

  // -------------------------------------------------------------------------
  // Button handlers
  // -------------------------------------------------------------------------
  btnStart.addEventListener('click',  () => send({ cmd: 'cycle_start' }));
  btnHold.addEventListener('click',   () => send({ cmd: 'feed_hold'   }));
  btnResume.addEventListener('click', () => send({ cmd: 'resume'      }));
  btnStop.addEventListener('click',   () => send({ cmd: 'stop'        }));

  // -------------------------------------------------------------------------
  // Slider handlers — send on release (pointerup / touchend) so we don't
  // flood the server while dragging.
  // -------------------------------------------------------------------------
  let draggingFeed    = false;
  let draggingSpindle = false;

  sliderFeed.addEventListener('pointerdown', () => { draggingFeed = true; });
  sliderFeed.addEventListener('input', () => {
    feedReadout.textContent = `${sliderFeed.value}%`;
  });
  sliderFeed.addEventListener('pointerup', () => {
    draggingFeed = false;
    send({ cmd: 'set_feedrate', value: sliderFeed.value / 100 });
  });

  sliderSpindle.addEventListener('pointerdown', () => { draggingSpindle = true; });
  sliderSpindle.addEventListener('input', () => {
    spindleReadout.textContent = `${sliderSpindle.value}%`;
  });
  sliderSpindle.addEventListener('pointerup', () => {
    draggingSpindle = false;
    send({ cmd: 'set_spindlerate', value: sliderSpindle.value / 100 });
  });

  // -------------------------------------------------------------------------
  // Boot
  // -------------------------------------------------------------------------
  connect();
</script>
</body>
</html>
